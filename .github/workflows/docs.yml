name: Deploy docs to GitHub Pages

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents:    read
    pages:       write
    id-token:    write

concurrency:
    group:              pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache:        npm
            - run: npm ci
            # Deploys the VitePress site from packages/lib — the docs that
            # actually have content. packages/docs is its eventual replacement
            # (a docs app built with the library itself), but is still a
            # proof-of-seam scaffold: pointing Pages at it published an empty
            # shell whose every sub-route 404s, so the deployment stays here
            # until that app reaches parity.
            #
            # docs:build runs docs:api (TypeDoc) and docs:llms itself, so they
            # need no separate steps; build:lib precedes it because the docs
            # import the built library. The NODE_OPTIONS heap pin is set at the
            # step level so TypeDoc inherits it too while it emits the ~105 MB
            # model. That requirement grows with the library, and the build now
            # OOMs on smaller developer machines while still completing on CI
            # runners — a local OOM here is expected, not a broken build.
            - run: npm run build:lib
            - run: npm run docs:build
              env:
                  NODE_OPTIONS: --max-old-space-size=12288
            # Built but deliberately not deployed. packages/docs is the
            # in-progress replacement docs app; compiling it here keeps it
            # honest — it resolves the library through the package exports map
            # and its vite plugin reads the TypeDoc model docs:build just
            # emitted — so a break surfaces in CI rather than months later.
            - run: npm run build:docs
              env:
                  NODE_OPTIONS: --max-old-space-size=12288
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: packages/lib/docs/.vitepress/dist

    deploy:
        needs:    build
        runs-on:  ubuntu-latest
        environment:
            name: github-pages
            url:  ${{ steps.deployment.outputs.page_url }}
        steps:
            - id:   deployment
              uses: actions/deploy-pages@v4
