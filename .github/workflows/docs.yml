name: Deploy docs to GitHub Pages

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents:    read
    pages:       write
    id-token:    write

concurrency:
    group:              pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache:        npm
            - run: npm ci
            # Deploys the VitePress site from packages/lib — the docs that
            # actually have content — as the site root, plus packages/docs
            # (a docs app built with the library itself) as a preview at
            # /next/ inside the same Pages artifact. VitePress keeps the site
            # root, so every URL in the published packages/lib/README.md
            # keeps resolving unchanged.
            #
            # docs:build runs docs:api (TypeDoc) and docs:llms itself, so they
            # need no separate steps; build:lib precedes it because the docs
            # import the built library. The NODE_OPTIONS heap pin is set at the
            # step level so TypeDoc inherits it too while it emits the ~105 MB
            # model. That requirement grows with the library, and the build now
            # OOMs on smaller developer machines while still completing on CI
            # runners — a local OOM here is expected, not a broken build.
            - run: npm run build:lib
            - run: npm run docs:build
              env:
                  NODE_OPTIONS: --max-old-space-size=12288
            - run: npm -w packages/docs run typecheck
            - run: npm -w packages/docs run test
            # packages/docs deploys to /next/ as a preview alongside the live
            # VitePress site — vite.config.ts's `base` is
            # /typescript-ui/next/, so its assets resolve correctly once
            # copied under the VitePress output that upload-pages-artifact
            # ships below.
            - run: npm run build:docs
              env:
                  NODE_OPTIONS: --max-old-space-size=12288
            - run: cp -r packages/docs/dist packages/lib/docs/.vitepress/dist/next
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: packages/lib/docs/.vitepress/dist

    deploy:
        needs:    build
        runs-on:  ubuntu-latest
        environment:
            name: github-pages
            url:  ${{ steps.deployment.outputs.page_url }}
        steps:
            - id:   deployment
              uses: actions/deploy-pages@v4
