name: Deploy docs to GitHub Pages

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents:    read
    pages:       write
    id-token:    write

concurrency:
    group:              pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache:        npm
            - run: npm ci
            # packages/docs (a docs app built with the library itself) is now
            # the site root, so every URL in the published
            # packages/lib/README.md keeps resolving unchanged. The former
            # preview build and its separate output-merging step are gone —
            # there is only one site to build now.
            #
            # build:pages runs build:lib, docs:api (TypeDoc), docs:llms, and
            # the docs app's own build in sequence. The NODE_OPTIONS heap pin
            # is set at the step level so TypeDoc inherits it while it emits
            # the ~105 MB model — the one remaining build step heavy enough to
            # need it now that the old static-site build is gone. That
            # requirement grows with the library, and the build now OOMs on
            # smaller developer machines while still completing on CI
            # runners — a local OOM here is expected, not a broken build.
            #
            # The docs typecheck/test steps run after it, not before: they
            # type-check against packages/lib's built .d.ts output, which
            # build:pages's build:lib substep is what produces.
            - run: npm run build:pages
              env:
                  NODE_OPTIONS: --max-old-space-size=12288
            - run: npm -w packages/docs run typecheck
            - run: npm -w packages/docs run test
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: packages/docs/dist

    deploy:
        needs:    build
        runs-on:  ubuntu-latest
        environment:
            name: github-pages
            url:  ${{ steps.deployment.outputs.page_url }}
        steps:
            - id:   deployment
              uses: actions/deploy-pages@v4
