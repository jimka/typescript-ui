name: Test packages/create-app

on:
    pull_request:
    push:
        branches: [master]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache:        npm
            - run: npm ci
            - run: npm -w packages/create-app run test
